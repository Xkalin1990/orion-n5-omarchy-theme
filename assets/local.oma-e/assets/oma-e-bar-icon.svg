<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Antenna -->
  <line x1="22" y1="5" x2="21" y2="11" stroke="#D2D8E2" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="22" cy="4.2" r="2.6" fill="#FF7A59"/>
  <!-- Pill visor head (tilted slightly forward) -->
  <g transform="translate(22, 14) rotate(8)">
    <rect x="-10" y="-5" width="20" height="10" rx="5" fill="#F2F0EB" stroke="#151820" stroke-width="1.6"/>
    <rect x="-5.5" y="-3.2" width="13" height="6.4" rx="3.2" fill="#121821"/>
    <circle cx="-1" cy="0" r="1.7" fill="#6AE8FF"/>
    <circle cx="4.2" cy="0" r="1.7" fill="#6AE8FF"/>
  </g>
  <!-- Slender capsule torso -->
  <g transform="translate(21, 25) rotate(10)">
    <rect x="-5" y="-6" width="10" height="12" rx="4.5" fill="#E6E4DD" stroke="#151820" stroke-width="1.5"/>
    <rect x="-4.8" y="1.5" width="9.6" height="2.4" rx="1" fill="#FF7A59"/>
  </g>
  <!-- Coral fender arc -->
  <path d="M 12.5 34.5 A 8.5 8.5 0 0 1 28.5 34.5" fill="none" stroke="#FF7A59" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Single gyro-wheel -->
  <circle cx="20.5" cy="36.2" r="5.6" fill="#2A303B" stroke="#E6E4DD" stroke-width="1.6"/>
  <circle cx="20.5" cy="36.2" r="2.2" fill="#FF7A59"/>
</svg>