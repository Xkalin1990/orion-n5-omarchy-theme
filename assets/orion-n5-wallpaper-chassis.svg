<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#25332c" stroke-width="1.5" stroke-opacity="0.45"/>
    </pattern>
    <pattern id="hazard" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="44" fill="#ff5a1f"/>
      <rect x="22" width="22" height="44" fill="#141615"/>
    </pattern>
    <g id="hex-cluster">
      <polygon points="0,-24 20.8,-12 20.8,12 0,24 -20.8,12 -20.8,-12" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="0,-72 20.8,-60 20.8,-36 0,-24 -20.8,-36 -20.8,-60" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="41.6,-48 62.4,-36 62.4,-12 41.6,0 20.8,-12 20.8,-36" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="41.6,0 62.4,12 62.4,36 41.6,48 20.8,36 20.8,12" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="0,24 20.8,36 20.8,60 0,72 -20.8,60 -20.8,36" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="-41.6,0 -20.8,12 -20.8,36 -41.6,48 -62.4,36 -62.4,12" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="-41.6,-48 -20.8,-36 -20.8,-12 -41.6,0 -62.4,-12 -62.4,-36" fill="none" stroke="currentColor" stroke-width="3.5"/>
    </g>
  </defs>

  <rect width="3840" height="2160" fill="#141615"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- Giant subtle D350 stencil -->
  <text x="160" y="1680" font-family="Inter, DejaVu Sans, sans-serif" font-weight="900" font-size="780" letter-spacing="-20" fill="#1e2220" opacity="0.55">D350</text>

  <!-- Stylized Rover / Logistics Module Silhouette (Right) -->
  <g transform="translate(2080, 560)">
    <!-- Shadow -->
    <ellipse cx="640" cy="860" rx="560" ry="44" fill="#0a0b0a" opacity="0.8"/>
    <!-- Rear articulated legs -->
    <polygon points="240,560 120,820 220,820 340,600" fill="#25332c" stroke="#0a0b0a" stroke-width="6"/>
    <polygon points="940,560 1060,820 1160,820 1040,600" fill="#25332c" stroke="#0a0b0a" stroke-width="6"/>
    <!-- Main Sage-Mint Chassis Body -->
    <polygon points="280,220 940,220 1140,360 1140,580 220,580 220,340" fill="#9ecab3" stroke="#141615" stroke-width="8"/>
    <!-- Panel seams & vents -->
    <line x1="560" y1="220" x2="560" y2="580" stroke="#141615" stroke-width="6"/>
    <line x1="860" y1="220" x2="860" y2="580" stroke="#141615" stroke-width="6"/>
    <rect x="610" y="270" width="190" height="44" rx="4" fill="#141615"/>
    <!-- Aerospace Orange Nose Cone -->
    <polygon points="80,380 220,340 220,580 110,580 80,500" fill="#ff5a1f" stroke="#141615" stroke-width="8"/>
    <rect x="108" y="420" width="60" height="22" fill="#eef7f2"/>
    <!-- Antennae -->
    <line x1="900" y1="220" x2="940" y2="40" stroke="#7d9689" stroke-width="6"/>
    <line x1="980" y1="220" x2="1030" y2="60" stroke="#7d9689" stroke-width="6"/>
    <circle cx="940" cy="40" r="10" fill="#ff5a1f"/>
    <!-- Chassis markings -->
    <text x="290" y="310" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="36" font-weight="800" fill="#141615">D350 // N5</text>
    <rect x="290" y="490" width="210" height="28" fill="url(#hazard)"/>
  </g>

  <!-- Top Left Emblem + Title -->
  <g transform="translate(220, 220) scale(1.2)" color="#9ecab3">
    <use href="#hex-cluster"/>
    <circle cx="0" cy="0" r="6" fill="#ff5a1f"/>
  </g>
  <text x="340" y="218" font-family="Inter, DejaVu Sans, sans-serif" font-weight="800" font-size="72" fill="#eef7f2">ORION N5</text>
  <text x="344" y="270" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="26" letter-spacing="4" fill="#ff5a1f">UTOPIA LOGISTICS DOME // UPLO-07</text>

  <!-- Bottom Strip -->
  <rect x="0" y="1980" width="3840" height="10" fill="#ff5a1f"/>
  <text x="160" y="2055" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="24" letter-spacing="4" fill="#7d9689">AUTOMATED FREIGHT LOCK 34 / 95  —  MARS SURFACE CHASSIS</text>
  <rect x="3320" y="2020" width="360" height="44" fill="url(#hazard)"/>
</svg>
