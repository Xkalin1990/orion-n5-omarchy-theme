# Orion N5 // D350 Orbital Data System — Tmux Status Bar
set -g status-style "bg=#0f1110,fg=#c4ddd0"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[bg=#ff5a1f,fg=#0a0b0a,bold] D350 // #S #[bg=#0f1110,fg=#25332c]│ "
set -g status-right "#[fg=#54685e]│ #[fg=#9ecab3]UPLO-07 #[fg=#54685e]│ #[fg=#e5a93c]%H:%M #[bg=#1e2220,fg=#ff5a1f,bold] LIVE.REC ● "

setw -g window-status-format "#[fg=#7d9689] #I:#W "
setw -g window-status-current-format "#[bg=#25332c,fg=#eef7f2,bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#25332c"
set -g pane-active-border-style "fg=#ff5a1f"
set -g message-style "bg=#1e2220,fg=#eef7f2"
set -g mode-style "bg=#25332c,fg=#eef7f2"
