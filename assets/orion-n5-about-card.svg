    <text x="20" y="34" font-family="Inter, DejaVu Sans, sans-serif" font-weight="800" font-size="22" fill="#0a0b0a">SYSTEM SPEC // NOMINAL</text>
    <text x="20" y="56" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#141615">LIVE.REC ●  D350 TELEMETRY LINK ACTIVE</text>
