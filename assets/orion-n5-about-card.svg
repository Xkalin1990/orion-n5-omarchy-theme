  <text x="28" y="524" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12" letter-spacing="2" fill="#54685e">PROTOCOL: OMARCHY-OS // TELEMETRY DIAGNOSTIC TERMINAL</text>

  <!-- Bottom Aerospace Orange Status Bar -->
  <g transform="translate(28, 550)">
