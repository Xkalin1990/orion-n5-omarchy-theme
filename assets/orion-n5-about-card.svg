    <text x="296" y="28" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="11" letter-spacing="2.5" fill="#7d9689">DEPLOYMENT SECTOR</text>
    <text x="296" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-weight="800" font-size="30" fill="#9ecab3">UPLO-07</text>
    <text x="296" y="102" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12" fill="#7d9689">UTOPIA LOGISTICS DOME</text>

