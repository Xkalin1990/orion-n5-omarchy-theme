    <text x="16" y="166" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="11" letter-spacing="2.5" fill="#7d9689">DISPLAY BUS</text>
    <text x="16" y="210" font-family="Inter, DejaVu Sans, sans-serif" font-weight="800" font-size="26" fill="#eef7f2">WAYLAND / SIXEL</text>
    <text x="16" y="240" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12" fill="#7db5a3">HYPRLAND COMPOSITOR</text>

