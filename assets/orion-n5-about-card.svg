    <text x="296" y="166" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="11" letter-spacing="2.5" fill="#7d9689">FREIGHT LOCK / INDEX</text>
    <text x="296" y="210" font-family="Inter, DejaVu Sans, sans-serif" font-weight="800" font-size="30" fill="#e5a93c">34 / 95</text>
    <text x="296" y="240" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="12" fill="#7d9689">NEXT WINDOW 07.12.2035</text>
