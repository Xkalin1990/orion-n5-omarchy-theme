      <polygon points="0,-48 13.86,-40 13.86,-24 0,-16 -13.86,-24 -13.86,-40" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <polygon points="27.71,-32 41.57,-24 41.57,-8 27.71,0 13.86,-8 13.86,-24" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <polygon points="27.71,0 41.57,8 41.57,24 27.71,32 13.86,24 13.86,8" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <polygon points="0,16 13.86,24 13.86,40 0,48 -13.86,40 -13.86,24" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <polygon points="-27.71,0 -13.86,8 -13.86,24 -27.71,32 -41.57,24 -41.57,8" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <polygon points="-27.71,-32 -13.86,-24 -13.86,-8 -27.71,0 -41.57,-8 -41.57,-24" fill="none" stroke="currentColor" stroke-width="2.4"/>
    </g>
