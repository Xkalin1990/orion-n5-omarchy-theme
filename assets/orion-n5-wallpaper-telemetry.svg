<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#25332c" stroke-width="2" stroke-opacity="0.45"/>
    </pattern>
    <pattern id="hazard-mint" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#141615" fill-opacity="0.18"/>
      <rect x="20" width="20" height="40" fill="transparent"/>
    </pattern>
    <g id="hex-cluster">
      <polygon points="0,-24 20.8,-12 20.8,12 0,24 -20.8,12 -20.8,-12" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="0,-72 20.8,-60 20.8,-36 0,-24 -20.8,-36 -20.8,-60" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="41.6,-48 62.4,-36 62.4,-12 41.6,0 20.8,-12 20.8,-36" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="41.6,0 62.4,12 62.4,36 41.6,48 20.8,36 20.8,12" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="0,24 20.8,36 20.8,60 0,72 -20.8,60 -20.8,36" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="-41.6,0 -20.8,12 -20.8,36 -41.6,48 -62.4,36 -62.4,12" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <polygon points="-41.6,-48 -20.8,-36 -20.8,-12 -41.6,0 -62.4,-12 -62.4,-36" fill="none" stroke="currentColor" stroke-width="3.5"/>
    </g>
  </defs>

  <!-- Left Obsidian Field -->
  <rect width="2560" height="2160" fill="#0f1110"/>
  <rect width="2560" height="2160" fill="url(#grid)"/>

  <!-- Right Modular Freight Lock Panels -->
  <rect x="2560" y="0" width="680" height="2160" fill="#9ecab3"/>
  <rect x="3240" y="0" width="600" height="2160" fill="#ff5a1f"/>
  <line x1="3240" y1="0" x2="3240" y2="2160" stroke="#141615" stroke-width="6"/>

  <!-- Sage Panel 34 -->
  <text x="2630" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-weight="900" font-size="160" fill="#141615">34</text>
  <text x="2634" y="340" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="28" letter-spacing="4" fill="#141615">AUTOMATED FREIGHT LOCK</text>
  <rect x="2630" y="385" width="540" height="32" fill="url(#hazard-mint)"/>
  <g transform="translate(2900, 1180) scale(3.2)" color="#141615" opacity="0.18">
    <use href="#hex-cluster"/>
  </g>

  <!-- Orange Panel 95 -->
  <text x="3310" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-weight="900" font-size="160" fill="#0a0b0a">95</text>
  <text x="3314" y="340" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="28" letter-spacing="4" fill="#0a0b0a">UPLO-07 // MARS</text>
  <rect x="3310" y="385" width="460" height="32" fill="url(#hazard-mint)"/>

  <!-- Left Telemetry Header -->
  <g transform="translate(240, 220) scale(1.1)" color="#9ecab3">
    <use href="#hex-cluster"/>
  </g>
  <text x="350" y="242" font-family="Inter, DejaVu Sans, sans-serif" font-weight="800" font-size="76" letter-spacing="-2" fill="#eef7f2">Orbital Data System</text>
  <text x="354" y="294" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="24" letter-spacing="4" fill="#7d9689">D350 // GLOBAL TELEMETRY INDEX</text>

  <!-- Bottom Left Window Indicator -->
  <text x="160" y="1920" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="28" letter-spacing="4" fill="#7d9689">NEXT WINDOW // 07.12.2035</text>
  <rect x="160" y="1960" width="960" height="10" fill="#ff5a1f"/>
</svg>
