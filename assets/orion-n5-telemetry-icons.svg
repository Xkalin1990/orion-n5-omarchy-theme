<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 140" width="512" height="140">
  <rect width="512" height="140" fill="#141615"/>
  <!-- 1: Orbital Target -->
  <g transform="translate(64, 62)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#9ecab3" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#ff5a1f"/>
    <line x1="-34" y1="0" x2="34" y2="0" stroke="#9ecab3" stroke-width="2"/>
    <line x1="0" y1="-34" x2="0" y2="34" stroke="#9ecab3" stroke-width="2"/>
    <text x="0" y="54" text-anchor="middle" font-family="monospace" font-size="11" fill="#7d9689">ORBIT.TRK</text>
  </g>
  <!-- 2: Signal Arc -->
  <g transform="translate(192, 62)">
    <path d="M -26 16 A 28 28 0 0 1 26 16" fill="none" stroke="#9ecab3" stroke-width="3"/>
    <path d="M -16 16 A 18 18 0 0 1 16 16" fill="none" stroke="#ff5a1f" stroke-width="3"/>
    <circle cx="0" cy="16" r="5" fill="#eef7f2"/>
    <text x="0" y="54" text-anchor="middle" font-family="monospace" font-size="11" fill="#7d9689">RCV.24H</text>
  </g>
  <!-- 3: Freight Lock -->
  <g transform="translate(320, 62)">
    <path d="M -18 -26 L -26 -26 L -26 -16 M 18 -26 L 26 -26 L 26 -16 M -26 16 L -26 26 L -18 26 M 26 16 L 26 26 L 18 26" fill="none" stroke="#ff5a1f" stroke-width="3"/>
    <rect x="-14" y="-14" width="28" height="28" fill="none" stroke="#c4ddd0" stroke-width="3"/>
    <text x="0" y="54" text-anchor="middle" font-family="monospace" font-size="11" fill="#7d9689">LOCK.UPLO</text>
  </g>
  <!-- 4: Hex Node -->
  <g transform="translate(448, 62)">
    <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="none" stroke="#9ecab3" stroke-width="3"/>
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" fill="#ff5a1f"/>
    <text x="0" y="54" text-anchor="middle" font-family="monospace" font-size="11" fill="#7d9689">HEX.NODE</text>
  </g>
